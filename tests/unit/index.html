  <script>
 // Minimal html tag function (just returns the string)
  window.html = (strings, ...values) => {
    let str = strings[0];
    values.forEach((v, i) => { str += v + strings[i + 1]; });
    return str;
  };

  // Minimal fixture: injects HTML into a container and returns the first child
  window.fixture = async (htmlString) => {
    const container = document.createElement('div');
    container.innerHTML = htmlString.trim();
    document.body.appendChild(container);
    // Optionally, wait for custom elements to upgrade/render
    await Promise.resolve();
    return container.firstElementChild;
  };
</script>
