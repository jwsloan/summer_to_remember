<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Summer to Remember</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Shoelace CDN for UI components -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/light.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/shoelace.js"></script>
  <script src="/js/config.js"></script>
  <script src="/store/auth-store.js"></script>
  <script src="/components/app-header.js"></script>
  <script src="/components/login-button.js"></script>
</head>
<body>
  <app-header title="Dashboard"></app-header>
  <main class="dashboard-main">
    <section class="user-profile">
      <!-- User profile image and name will be rendered here -->
    </section>
    <section class="upcoming-activities">
      <h2>Upcoming</h2>
      <div class="activities-list">
        <!-- Next 3 planned activities will be rendered here -->
      </div>
    </section>
    <section class="today-tasks">
      <h2>Today</h2>
      <div class="today-summary">
        <!-- Count of today's tasks -->
        <span class="today-count"></span>
        <button class="go-to-today">Go to Today</button>
      </div>
    </section>
  </main>
  <script src="/js/auth-controller.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
