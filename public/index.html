<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer to Remember</title>
  <!-- Shoelace CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/light.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/shoelace.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Beach emoji favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8F%96%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <!-- Firebase Compat CDN scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <header style="display: flex; align-items: center; justify-content: space-between;">
    <h1>☀️ Summer to Remember</h1>
    <div class="auth-controls" style="display: flex; align-items: center; gap: 0.5em;">
      <sl-button id="sign-in-btn" variant="primary">Sign in with Google</sl-button>
      <sl-button id="sign-out-btn" variant="danger" style="display:none;">Sign out</sl-button>
      <div id="user-info" style="margin-left: 1em;"></div>
      <div id="auth-error" style="color:red; margin-left: 1em;"></div>
    </div>
  </header>
  <nav>
    <sl-button href="activities.html" variant="primary">Activities</sl-button>
    <sl-button href="calendar.html" variant="success">Calendar</sl-button>
    <sl-button href="memories.html" variant="warning">Memories</sl-button>
    <sl-button href="settings.html" variant="default">Settings</sl-button>
  </nav>
  <main>
    <p>Welcome! Plan, schedule, and remember your best summer yet.</p>
  </main>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
  // Wait for DOM and Shoelace to be ready
  document.addEventListener('DOMContentLoaded', function() {
    const signInBtn = document.getElementById('sign-in-btn');
    const signOutBtn = document.getElementById('sign-out-btn');
    const userInfo = document.getElementById('user-info');
    const authError = document.getElementById('auth-error');

    function showUser(user) {
      userInfo.textContent = `Signed in as: ${user.displayName} (${user.email})`;
      authError.textContent = '';
    }
    function showSignedOut() {
      userInfo.textContent = '';
      authError.textContent = '';
    }
    function showDenied() {
      userInfo.textContent = '';
      authError.textContent = 'Access denied. You are not authorized to use this app.';
    }

    // Listen for auth state changes
    window.authHelpers.onAuthStateChanged(user => {
      if (user) {
        // Check UID restriction
        if (typeof ALLOWED_UIDS !== 'undefined' && !ALLOWED_UIDS.includes(user.uid)) {
          showDenied();
          signInBtn.style.display = '';
          signOutBtn.style.display = 'none';
          setTimeout(() => window.authHelpers.signOut(), 1000);
        } else {
          showUser(user);
          signInBtn.style.display = 'none';
          signOutBtn.style.display = '';
        }
      } else {
        showSignedOut();
        signInBtn.style.display = '';
        signOutBtn.style.display = 'none';
      }
    });

    signInBtn.addEventListener('click', () => {
      window.authHelpers.signInWithGoogle().catch(err => {
        authError.textContent = err.message;
      });
    });
    signOutBtn.addEventListener('click', () => {
      window.authHelpers.signOut();
    });
  });
  </script>
</body>
</html>
