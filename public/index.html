<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summer to Remember</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Shoelace CDN for UI components -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/light.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/shoelace.js"></script>
  <script src="/js/config.js"></script>
  <script src="/store/auth-store.js"></script>
  <script src="/components/app-header.js"></script>
  <script src="/components/login-button.js"></script>
</head>
<body>
  <app-header title="Summer to Remember"></app-header>
  <main class="centered">
    <section class="login-card">
      <h1>Welcome to Summer to Remember</h1>
      <p>Plan, track, and capture your summer adventures with Google Tasks, Calendar, and Photos—all in one place.</p>
      <div id="index-action"><sl-spinner style="font-size:2rem;"></sl-spinner></div>
    </section>
  </main>
  <script src="/js/auth-controller.js"></script>
  <script>
    // Show login button or dashboard link based on auth state
    function renderIndexAction() {
      const actionDiv = document.getElementById('index-action');
      if (window.s2r.auth && window.s2r.auth.store && window.s2r.auth.store.isLoggedIn !== undefined) {
        if (window.s2r.auth.store.isLoggedIn) {
          actionDiv.innerHTML = '<sl-button variant="primary" onclick="window.location.href=\'/dashboard.html\'">Go to Dashboard</sl-button>';
        } else {
          actionDiv.innerHTML = '<login-button></login-button>';
        }
      } else {
        actionDiv.innerHTML = '<sl-spinner style="font-size:2rem;"></sl-spinner>';
      }
    }
    document.addEventListener('DOMContentLoaded', () => {
      if (window.s2r && window.s2r.initAuthController) {
        window.s2r.initAuthController();
      }
      renderIndexAction();
      if (window.s2r.auth && window.s2r.auth.subscribe) {
        window.s2r.auth.subscribe(renderIndexAction);
      } else {
        // Try again after a short delay if authStore isn't ready
        setTimeout(() => {
          if (window.s2r.auth && window.s2r.auth.subscribe) {
            window.s2r.auth.subscribe(renderIndexAction);
            renderIndexAction();
          }
        }, 200);
      }
    });
  </script>
</body>
</html>
