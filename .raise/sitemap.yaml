sitemap:
  title: "Summer to Remember - Family Activity Tracker"
  
  pages:
    - name: "Dashboard"
      path: "/"
      description: "App-style dashboard showing summer progress and recent activities"
      sections:
        - "Dashboard header with Summer 2024 title and New Activity button"
        - "Four key stats cards: Activities Planned, Completed, Photos, Memories"
        - "Recent Adventures card with activity timeline"
        - "Upcoming Plans card with scheduled activities"
      
    - name: "Activity Ideas & Planning"
      path: "/activities"
      description: "View Google Tasks activity ideas, add family priorities/notes, and promote selected tasks to scheduled calendar events"
      sections:
        - "Task Ideas from Google Tasks (with family priority overlay)"
        - "Promotion interface to schedule selected tasks"
        - "View scheduled activities from Google Calendar"
      filters:
        - "All task ideas"
        - "By priority level"
        - "Promoted vs unpromoted"
      
    - name: "Activity Detail"
      path: "/activities/:id"
      description: "Individual activity page with photos and family memories"
      sections:
        - "Activity overview and description"
        - "Scheduling (Google Calendar integration)"
        - "Photo album (Google Photos integration)"
        - "Family memories and notes"
      actions:
        - "Edit activity details"
        - "Add photos"
        - "Add family memory"
        - "Schedule activity"
        - "Mark as complete"
      
    - name: "Family Login"
      path: "/login"
      description: "Firebase authentication for family members"
      sections:
        - "Google sign-in for family members"
        - "Clean, app-style login form"
      
  navigation:
    primary:
      - "Dashboard"
      - "Activities"
    
    auth_dependent:
      - "Login button (when logged out)"
      - "User avatar/menu (when logged in)"
  
  external_integrations:
    - name: "Google Tasks"
      purpose: "Activity idea brainstorming pool"
      integration_points:
        - "Activity Ideas page (read task list)"
        - "Task list creation on first auth"
      data_flow: "Source of truth for activity ideas and completion status"
    
    - name: "Google Calendar" 
      purpose: "Scheduled activity management"
      integration_points:
        - "Activity promotion creates calendar events"
        - "Dashboard shows upcoming scheduled activities"
      data_flow: "Source of truth for scheduled events and timing"
    
    - name: "Google Photos"
      purpose: "Memory storage and photo organization"
      integration_points:
        - "Activity memories linked to photo albums"
        - "Completed activity photo display"
      data_flow: "Source of truth for images and visual memories"
    
    - name: "Firebase Auth"
      purpose: "Family member authentication and Google API access"
      integration_points:
        - "Login page"
        - "OAuth token provision for Google APIs"
      data_flow: "Authentication provider and API token source"
      
    - name: "Firebase Firestore"
      purpose: "App-specific enhancements and tracking"
      integration_points:
        - "Task priority levels and family notes"
        - "Task-to-event promotion tracking"
      data_flow: "Enhancement layer, not source of truth"