sitemap:
  title: "Summer to Remember - Family Activity Tracker"
  
  pages:
    - name: "Dashboard"
      path: "/"
      description: "App-style dashboard showing summer progress and recent activities"
      sections:
        - "Dashboard header with Summer 2024 title and New Activity button"
        - "Four key stats cards: Activities Planned, Completed, Photos, Memories"
        - "Recent Adventures card with activity timeline"
        - "Upcoming Plans card with scheduled activities"
      
    - name: "Activities List"
      path: "/activities"
      description: "Master list of summer activities organized by status"
      sections:
        - "Unscheduled Activities"
        - "Scheduled Activities" 
        - "Completed Activities"
        - "Add New Activity button"
      filters:
        - "All activities"
        - "By family member"
        - "By activity type"
      
    - name: "Activity Detail"
      path: "/activities/:id"
      description: "Individual activity page with photos and family memories"
      sections:
        - "Activity overview and description"
        - "Scheduling (Google Calendar integration)"
        - "Photo album (Google Photos integration)"
        - "Family memories and notes"
      actions:
        - "Edit activity details"
        - "Add photos"
        - "Add family memory"
        - "Schedule activity"
        - "Mark as complete"
      
    - name: "Family Login"
      path: "/login"
      description: "Firebase authentication for family members"
      sections:
        - "Google sign-in for family members"
        - "Clean, app-style login form"
      
  navigation:
    primary:
      - "Dashboard"
      - "Activities"
    
    auth_dependent:
      - "Login button (when logged out)"
      - "User avatar/menu (when logged in)"
  
  external_integrations:
    - name: "Google Tasks"
      purpose: "Activity list management"
      integration_points:
        - "Activities List page"
        - "Activity creation"
    
    - name: "Google Calendar" 
      purpose: "Activity scheduling"
      integration_points:
        - "Activity Detail scheduling"
        - "Home dashboard calendar view"
    
    - name: "Google Photos"
      purpose: "Photo storage and albums"
      integration_points:
        - "Activity Detail photo display"
        - "Photo upload and organization"
    
    - name: "Firebase Auth"
      purpose: "Family member authentication"
      integration_points:
        - "Login page"
        - "User session management"